{% extends "base.html" %}
{% block titulo %}Recuperar senha — CirculaGov{% endblock %}
{% block conteudo %}
<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-8">
  <h1 class="text-xl font-semibold text-slate-900 mb-1">Recuperar senha</h1>
  <p class="text-sm text-slate-500 mb-6">Informe seu usuário para receber o link de redefinição.</p>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_username" class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
      <input type="text" name="username" id="id_username" required autofocus class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
    </div>
    <button type="submit" class="w-full rounded-md bg-blue-900 text-white text-sm font-medium py-2.5 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 transition">
      Enviar link de recuperação
    </button>
  </form>

  <p class="mt-4 text-sm text-center">
    <a href="{% url 'login' %}" class="text-blue-700 hover:underline">Voltar para o login</a>
  </p>
</div>
{% endblock %}
