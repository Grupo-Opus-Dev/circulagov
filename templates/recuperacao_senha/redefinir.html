{% extends "base.html" %}
{% block titulo %}Redefinir senha — CirculaGov{% endblock %}
{% block conteudo %}
<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-8">
  <h1 class="text-xl font-semibold text-slate-900 mb-1">Redefinir senha</h1>
  <p class="text-sm text-slate-500 mb-6">Escolha uma nova senha para sua conta.</p>

  {% if messages %}
    {% for mensagem in messages %}
      <div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
        {{ mensagem }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_senha_nova" class="block text-sm font-medium text-slate-700 mb-1">Nova senha</label>
      <input type="password" name="senha_nova" id="id_senha_nova" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
    </div>
    <div>
      <label for="id_confirmacao" class="block text-sm font-medium text-slate-700 mb-1">Confirme a nova senha</label>
      <input type="password" name="confirmacao" id="id_confirmacao" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600">
    </div>
    <button type="submit" class="w-full rounded-md bg-blue-900 text-white text-sm font-medium py-2.5 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 transition">
      Redefinir senha
    </button>
  </form>
</div>
{% endblock %}
