<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>CirculaGov — Entrar</title>
  </head>
  <body>
    <h1>CirculaGov</h1>

    {% if form.non_field_errors %} {% for erro in form.non_field_errors %}
    <p>{{ erro }}</p>
    {% endfor %} {% elif form.errors %}
    <p>Usuário ou senha inválidos.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %} {{ form.as_p }}
      <button type="submit">Entrar</button>
    </form>
  </body>
</html>
