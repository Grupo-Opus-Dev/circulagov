# Limites de requisicoes do CirculaGov, parte que vale no contexto "http".
#
# Instalar em /etc/nginx/conf.d/circulagov-limites.conf. As diretivas
# limit_req que usam estas zonas ficam em circulagov-limites-servidor.conf,
# incluido dentro do bloco "server" do site.
#
# Como funciona a escolha do que contar: uma zona so conta as requisicoes
# cuja chave nao e vazia. Cada "map" devolve o IP do cliente apenas para a
# combinacao de metodo e caminho que interessa, e vazio para todo o resto,
# que assim nao entra na conta. Dessa forma o servidor precisa de uma unica
# linha de include, em vez de um bloco "location" por rota, e os blocos que
# o certbot gerou ficam intocados.

map "$request_method:$uri" $chave_login {
    default                   "";
    "POST:/contas/login/"     $binary_remote_addr;
}

# O segundo fator nao tem nenhuma trava de tentativas no aplicativo: quem
# acerta a senha pode tentar codigos de 6 digitos sem limite. Este limite
# reduz isso por IP, mas nao resolve. A trava de verdade, por conta,
# precisaria existir no codigo.
map "$request_method:$uri" $chave_2fa {
    default                          "";
    "POST:/dois-fatores/verificar/"  $binary_remote_addr;
}

# Cada POST aqui dispara um e-mail. Sem limite, alguem enche a caixa de uma
# pessoa e gasta a cota diaria de envios da conta de e-mail.
map "$request_method:$uri" $chave_recuperacao {
    default                      "";
    "POST:/recuperar-senha/"     $binary_remote_addr;
}

limit_req_zone $chave_login        zone=circulagov_login:10m        rate=30r/m;
limit_req_zone $chave_2fa          zone=circulagov_2fa:10m          rate=10r/m;
limit_req_zone $chave_recuperacao  zone=circulagov_recuperacao:10m  rate=3r/m;

# Teto geral por IP, para qualquer rota. Barra inundacao simples sem
# atrapalhar navegacao normal: uma pagina do admin carrega uma dezena de
# arquivos de uma vez, e o "burst" absorve isso.
limit_req_zone $binary_remote_addr zone=circulagov_geral:10m        rate=20r/s;
