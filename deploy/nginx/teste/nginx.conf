# nginx minimo so para testar os limites, com os mesmos arquivos de
# configuracao que vao para o servidor. Usado por ../testar-limites.sh.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;

    include /etc/nginx/conf.d/circulagov-limites.conf;

    server {
        listen 8081;

        include /etc/nginx/snippets/circulagov-limites-servidor.conf;

        # O "upstream" e um servidor falso, que responde 200 pra tudo. O
        # que importa aqui e o que o nginx decide antes de chegar nele.
        location / {
            proxy_pass http://127.0.0.1:9000;
        }
    }
}
