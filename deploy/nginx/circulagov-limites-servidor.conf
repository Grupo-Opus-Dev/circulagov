# Limites de requisicoes do CirculaGov, parte que vale dentro do "server".
#
# Instalar em /etc/nginx/snippets/circulagov-limites-servidor.conf e incluir
# no bloco server do site com a linha:
#
#     include /etc/nginx/snippets/circulagov-limites-servidor.conf;
#
# Precisa do circulagov-limites.conf instalado antes, porque define as zonas.

# 429 Too Many Requests, em vez do 503 que o nginx usa por padrao. 503
# parece falha do servidor e confunde quem le o log.
limit_req_status 429;
limit_req_log_level warn;

# "burst" e quantas requisicoes alem da taxa passam de uma vez, e
# "nodelay" faz essas passarem na hora em vez de ficarem esperando. Sem
# o nodelay, quem erra a senha duas vezes seguidas esperaria 2 segundos
# sem saber por que a pagina travou.
limit_req zone=circulagov_login        burst=15 nodelay;
limit_req zone=circulagov_2fa          burst=5  nodelay;
limit_req zone=circulagov_recuperacao  burst=3  nodelay;
limit_req zone=circulagov_geral        burst=60 nodelay;
