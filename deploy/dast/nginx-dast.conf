# Proxy TLS usado so no DAST (.github/workflows/devsecops-avancado.yml).
#
# Em producao o Gunicorn fica atras de um nginx que termina o TLS. Este
# arquivo reproduz isso no runner, para o ZAP varrer a aplicacao como ela
# roda de verdade: com HTTPS, cookies Secure e o cabecalho
# X-Forwarded-Proto que o Django exige com DEBUG=False.
#
# Sem esse proxy, o ZAP falaria HTTP simples e nao devolveria os cookies
# Secure (o de CSRF inclusive), entao todo POST seria recusado com 403 e a
# varredura de injecao nao testaria nada.
#
# O certificado e gerado na hora, descartavel (ver o workflow). Os limites
# de requisicoes de producao ficam de fora de proposito: aqui o que se
# quer medir e a aplicacao, nao o nginx.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;

    server {
        listen 8443 ssl;

        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $remote_addr;
        }
    }
}
