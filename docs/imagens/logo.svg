<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d">
  <title id="t">CirculaGov</title>
  <desc id="d">Escudo com um livro aberto e um sinal de verificação, sobre um anel de circulação</desc>
  <rect width="640" height="340" fill="#ffffff"/>
  <g transform="translate(320 120)">
    <!-- anel de circulacao -->
    <circle r="92" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-dasharray="520 60" stroke-linecap="round" transform="rotate(-70)"/>
    <path d="M70 -62 L94 -66 L84 -42 Z" fill="#1e3a8a" transform="rotate(8 80 -56)"/>
    <!-- escudo -->
    <path d="M0 -70 L56 -50 V4 C56 40 28 62 0 76 C-28 62 -56 40 -56 4 V-50 Z" fill="#eff6ff" stroke="#1e3a8a" stroke-width="6" stroke-linejoin="round"/>
    <!-- livro aberto -->
    <path d="M0 -22 C-14 -32 -32 -32 -42 -28 V22 C-32 18 -14 18 0 28 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -22 C14 -32 32 -32 42 -28 V22 C32 18 14 18 0 28 Z" fill="#dbeafe" stroke="#1e3a8a" stroke-width="5" stroke-linejoin="round"/>
    <!-- verificacao -->
    <circle cx="40" cy="42" r="22" fill="#16a34a" stroke="#ffffff" stroke-width="5"/>
    <path d="M29 42 L37 50 L52 33" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="320" y="262" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#1e3a8a" letter-spacing="-1">CirculaGov</text>
  <text x="320" y="296" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#334155" letter-spacing="2">IDENTIDADE E PROTEÇÃO DE DADOS</text>
  <text x="320" y="322" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#64748b" letter-spacing="1">CIRCULAÇÃO DE LIVROS NA REDE PÚBLICA</text>
</svg>
