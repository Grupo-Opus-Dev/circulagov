# Detectores proprios do TruffleHog para o CirculaGov.
#
# Os detectores que vem com a ferramenta conhecem o formato de chaves de
# provedores (AWS, GitHub, Stripe e outros). As chaves de criptografia deste
# projeto sao so base64 de 32 bytes, sem formato proprio, entao nenhum
# detector padrao as reconhece. Estes aqui cobrem esse caso.
#
# Usado por .github/workflows/devsecops-pipeline.yml (--config). Os padroes
# foram conferidos contra todo o historico do repositorio, sem achado.
detectors:
  - name: chave-aes-ou-hmac-do-circulagov
    keywords:
      - CHAVE_CIFRAGEM_2FA
      - CHAVE_INTEGRIDADE_LOGS
    regex:
      # Atribuicao de um valor base64 (43 a 44 caracteres e 32 bytes ou mais)
      valor: '(?:CHAVE_CIFRAGEM_2FA|CHAVE_INTEGRIDADE_LOGS)\s*[=:]\s*[''"]?[A-Za-z0-9+/]{42,}={0,2}'

  - name: secret-key-do-django-literal
    keywords:
      - SECRET_KEY
    regex:
      # So casa quando o valor esta escrito entre aspas. SECRET_KEY = env('SECRET_KEY')
      # le da variavel de ambiente e nao casa.
      valor: 'SECRET_KEY\s*[=:]\s*[''"][^''"\s$()]{40,}[''"]'
